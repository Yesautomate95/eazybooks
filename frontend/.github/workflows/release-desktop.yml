name: Release Desktop

# Cuts an EazyBooks desktop release on tag push (e.g. `git tag v1.0.7 && git push --tags`):
#   1. Builds the Electron NSIS installer on a Windows runner.
#   2. Uploads the .exe + latest.yml (electron-updater feed) + blockmap to
#      Cloudflare R2 under `desktop/`.
#   3. Also publishes a stable `latest.exe` alias for the website's download
#      button so the URL never goes stale.
#   4. Bumps LATEST_VERSION in the website's Tally.jsx + electron_app version,
#      commits to main with [skip ci], and lets Vercel rebuild.
#
# Required GitHub repo secrets:
#   R2_ACCOUNT_ID            - Cloudflare account ID
#   R2_ACCESS_KEY_ID         - R2 API token access key
#   R2_SECRET_ACCESS_KEY     - R2 API token secret
#   R2_BUCKET_NAME           - e.g. "eazybooks-desktop-releases"
#
# Existing 1.0.6 installs polling the old AWS S3 bucket won't auto-discover
# R2 — they'll need a manual redownload. (Bridge step intentionally omitted.)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v, e.g. 1.0.7)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron_app/package-lock.json

      - name: Sync electron_app/package.json version
        shell: bash
        working-directory: ./electron_app
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: ./electron_app
        run: npm ci

      # The Tally loader (dist/*.mjs) imports js-yaml/pg/pg-copy-streams at
      # runtime and is shipped via extraResources, so it needs its OWN
      # node_modules next to it. electron-builder is invoked directly below
      # (bypassing `npm run build`), so install the loader deps explicitly.
      - name: Install tally-loader runtime deps
        working-directory: ./electron_app
        run: npm ci --omit=dev --prefix tally-loader

      - name: Build NSIS installer
        working-directory: ./electron_app
        env:
          # Tell electron-builder NOT to publish itself — the workflow handles
          # uploads explicitly so we control naming and the `latest.exe` alias.
          ELECTRON_BUILDER_DISABLE_PUBLISH: 'true'
        run: npx electron-builder build --win --publish never

      - name: Verify build artifacts
        shell: bash
        working-directory: ./electron_app
        run: |
          ls -la dist/
          VERSION="${{ steps.version.outputs.version }}"
          test -f "dist/EazyBooks-Setup-${VERSION}.exe" \
            || { echo "::error::Expected dist/EazyBooks-Setup-${VERSION}.exe missing"; exit 1; }
          test -f "dist/latest.yml" \
            || { echo "::error::dist/latest.yml missing — auto-updates will not work"; exit 1; }

      - name: Configure AWS CLI for R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region auto
          aws configure set default.s3.addressing_style path

      - name: Upload to R2
        shell: bash
        env:
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd electron_app/dist

          # Versioned installer (referenced by latest.yml for auto-update integrity)
          aws s3 cp "EazyBooks-Setup-${VERSION}.exe" \
            "s3://${R2_BUCKET}/desktop/EazyBooks-Setup-${VERSION}.exe" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/octet-stream" \
            --cache-control "public, max-age=31536000, immutable"

          # latest.exe alias — stable URL for the website download button
          aws s3 cp "EazyBooks-Setup-${VERSION}.exe" \
            "s3://${R2_BUCKET}/desktop/latest.exe" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/octet-stream" \
            --cache-control "public, max-age=300"

          # electron-updater feed metadata + integrity blockmap
          aws s3 cp "latest.yml" "s3://${R2_BUCKET}/desktop/latest.yml" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "text/yaml" \
            --cache-control "public, max-age=300"

          if [ -f "EazyBooks-Setup-${VERSION}.exe.blockmap" ]; then
            aws s3 cp "EazyBooks-Setup-${VERSION}.exe.blockmap" \
              "s3://${R2_BUCKET}/desktop/EazyBooks-Setup-${VERSION}.exe.blockmap" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/octet-stream" \
              --cache-control "public, max-age=31536000, immutable"
          fi

      - name: Bump LATEST_VERSION in website
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # In-place edit of the single LATEST_VERSION constant. Quote it to
          # avoid matching the regex against package-lock noise.
          sed -i -E "s/const LATEST_VERSION = \"[^\"]*\";/const LATEST_VERSION = \"${VERSION}\";/" \
            src/components/Pages/EazyBooksCA/Tally.jsx
          grep -n "LATEST_VERSION" src/components/Pages/EazyBooksCA/Tally.jsx

      - name: Commit + push version bump
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add electron_app/package.json electron_app/package-lock.json \
                  src/components/Pages/EazyBooksCA/Tally.jsx
          if git diff --cached --quiet; then
            echo "Nothing to commit — version already at ${VERSION}"
            exit 0
          fi
          git commit -m "chore(release): bump desktop to v${VERSION} [skip ci]"
          git push origin main

      - name: Summary
        if: success()
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Desktop v${VERSION} released"
            echo ""
            echo "- Installer: https://pub-5d6be9a7b1324f2c99df92a72a3b216c.r2.dev/desktop/EazyBooks-Setup-${VERSION}.exe"
            echo "- Latest alias: https://pub-5d6be9a7b1324f2c99df92a72a3b216c.r2.dev/desktop/latest.exe"
            echo "- Update feed: https://pub-5d6be9a7b1324f2c99df92a72a3b216c.r2.dev/desktop/latest.yml"
            echo "- Website LATEST_VERSION committed to main; Vercel will redeploy."
          } >> "$GITHUB_STEP_SUMMARY"
